name: Deployment

on:
  push:
    branches: [ "development", "main"]
  workflow_dispatch:
    inputs:
      github_ref:
        description: "Deploy a specific branch, tag or commit (default: the selected branch)"
        required: false
        type: string
      target:
        description: "Where to deploy to"
        required: false
        default: development
        type: choice
        options: [ development, production ]
      dry_run:
        description: "Dry run: validate the compose setup and build the image on the server, but don't restart the site"
        required: false
        default: false
        type: boolean

# Deploys share one directory on the server; never run two at once.
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Cleaning up docker images that are not currently running."
            docker images --filter="reference=kronos/server:*" --format '{{.Repository}}:{{.Tag}}' |  grep -v "$(docker ps --format {{.Image}})" | xargs -r docker rmi
            docker system prune -f

  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
      DEPLOY_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

    steps:
      # Resolve whatever was pushed or requested to one full commit SHA. The server builds exactly
      # that commit and the image is tagged with it, so every image maps to one commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.github_ref || github.sha }}

      - name: Resolve commit
        run: |
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve a commit: $sha"; exit 1; }
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"
          echo "Deploying $sha to $DEPLOY_TARGET (dry run: $DEPLOY_DRY_RUN)"

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Not TARGET: ssh-action's own entrypoint.sh overwrites that variable with its binary path.
          envs: DEPLOY_SHA,DEPLOY_TARGET,DEPLOY_DRY_RUN
          # The server is not a checkout of this repo: APP_PATH holds its own compose file, which builds
          # the image straight from GitHub at $GITHUB_REF and tags it kronos/server:$TAG.
          script: |
            set -e
            cd ${{ vars.APP_PATH }}
            echo "Deploying $DEPLOY_SHA with $DEPLOY_TARGET.env (dry run: $DEPLOY_DRY_RUN)"
            export GITHUB_REF="$DEPLOY_SHA"
            export TAG="$DEPLOY_SHA"
            docker compose --env-file "$DEPLOY_TARGET.env" config --quiet
            docker compose --env-file "$DEPLOY_TARGET.env" build
            # Start the new image once on its own and connect to the database the way the app does.
            # Read-only (SELECT 1); if it fails, the running site is left alone.
            docker compose --env-file "$DEPLOY_TARGET.env" run --rm --no-deps server python -m app.check_db
            # Report which tables the app can read. Informational only: a database problem must never block
            # deploying a fix. The output shows up in this job's log.
            docker compose --env-file "$DEPLOY_TARGET.env" run --rm --no-deps server python -m app.check_db --tables \
              || echo "WARNING: some tables can't be read (see above); deploying anyway."
            if [ "$DEPLOY_DRY_RUN" = "true" ]; then
              echo "Dry run: compose setup is valid, the image builds and reaches the database. Running containers were not touched."
              exit 0
            fi
            docker compose --env-file "$DEPLOY_TARGET.env" up -d
