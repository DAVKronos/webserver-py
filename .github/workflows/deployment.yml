name: Deployment

on:
  push:
    branches: [ "development", "main"]
  workflow_dispatch:
    inputs:
      github_ref:
        description: "Deploy a specific commit"
        required: false
        type: string
      target:
        description: "Where to deploy to"
        required: false
        default: development
        type: string

jobs:
  clean:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Cleaning up docker images that are not currently running."
            docker images --filter="reference=kronos/server:*" --format '{{.Repository}}:{{.Tag}}' |  grep -v "$(docker ps --format {{.Image}})" | xargs -r docker rmi
            docker system prune -f
    
  deploy:
    runs-on: ubuntu-latest
    env:
      github_ref: ${{ inputs.github_ref || github.ref }}
      tag: ${{ inputs.github_ref && '' || github.ref_name }}
      target: ${{ inputs.target || (github.ref=='refs/heads/main' && 'production' || 'development') }}
              
    steps:
      - name: Tag docker image with commit hash.
        if: ${{ env.tag == '' }}
        run: echo "tag=$(git rev-parse --short ${{ env.github_ref }})" >> $GITHUB_ENV
      
      - run: echo "ref=${{ env.github_ref }} tag=${{env.tag}} target=${{ env.target }}"
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ vars.APP_PATH }}
            export GITHUB_REF=${{env.github_ref}}
            export TAG=${{env.tag}}
            docker compose --env-file ${{env.target}}.env up --build -d
