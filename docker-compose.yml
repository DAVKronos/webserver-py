services:
  python:
    build:
      context: ./
    container_name: kronos_python
    volumes:
      - frontend_build:/app/static/react
      - ./config.toml:/app/config.toml
      - ./app:/app/app
    ports:
      - 8001:8001
  
  frontend:
    build:
      context: ./frontend
    container_name: kronos_frontend
    command: node esbuild.js
    volumes:
      - frontend_build:/app/build
      - frontend_node_modules:/app/node_modules
      - ./frontend:/app

volumes:
  frontend_build:
  frontend_node_modules:
