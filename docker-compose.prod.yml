# Production: only the backend image, with the minified frontend bundle baked in.
# No code bind mounts and no esbuild watcher; the image is exactly what was built.
#   TAG=<tag> docker compose -f docker-compose.prod.yml up --build -d --remove-orphans
services:
  python:
    build:
      context: ./
    image: kronos/server:${TAG:-latest}
    container_name: kronos_python
    restart: unless-stopped
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./static:/app/static   # uploaded files (photos, avatars, ...)
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
